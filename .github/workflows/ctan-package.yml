name: Build CTAN submission

on:
  push:
    branches:
      - main
    paths:
      - 'coop-writing.dtx'
      - 'coop-writing.ins'
      - 'coop-writing.bib'
      - 'coop-writing.sty'
      - 'README.md'
      - 'changes.md'
      - 'new.md'
      - 'LICENSE'
      - 'quickref-*.tex'
      - 'max-example-en-us.tex'
      - 'max-exemplo-pt-br.tex'
      - 'images/**'
      - 'example-fragments/**'
      - 'tools/build-ctan.sh'
      - 'tools/build-dist.sh'
      - '.github/workflows/ctan-package.yml'

permissions:
  contents: write

concurrency:
  group: ctan-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile CTAN documentation
        uses: xu-cheng/latex-action@v4
        with:
          pre_compile: rm -f coop-writing.sty && latex -interaction=nonstopmode -halt-on-error coop-writing.ins
          root_file: |
            coop-writing.dtx
            quickref-en-us.tex
            quickref-pt-br.tex
            max-example-en-us.tex
            max-exemplo-pt-br.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Build generated distribution
        run: bash tools/build-dist.sh

      - name: Assemble and validate CTAN archive
        run: bash tools/build-ctan.sh

      - name: Commit generated CTAN staging directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist ctan-submission coop-writing.sty coop-writing.pdf quickref-en-us.pdf quickref-pt-br.pdf max-example-en-us.pdf max-exemplo-pt-br.pdf
          if git diff --cached --quiet; then
            echo "CTAN staging directory already up to date."
          else
            git commit -m "release: generate CTAN submission"
            git push
          fi
